services:
  docy:
    # Public image in the customer's Docker Hub org — anonymous pulls, no
    # docker login needed. To build your own instead:
    #   docker build -t opendocy/open-docy:latest .
    image: opendocy/open-docy:latest
    container_name: docy
    ports:
      - "3000:3000"
    volumes:
      - docy-data:/app/src/backend/docy/storage   # database / queue / uploads / AI state
      - docy-config:/data/config                  # settings.ini + secrets.env
    # Configuration: copy .env.sample to .env next to this file — compose
    # auto-loads .env and substitutes the ${VAR} references below. No
    # compose-file edits needed; leaving .env absent starts with defaults
    # (only agent tasks need the AI provider keys).
    environment:
      # AI credentials (pass-through to the AI plugin)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_DEFAULT: ${MODEL_DEFAULT:-}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      # Platform auth: aliases of DOCY_API_KEY / DOCY_SECRET_KEY — when
      # pinned (non-empty), written into settings.ini [Security] api_key /
      # secret_key instead of the auto-generated values
      API_KEY: ${API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
    # Optional: switch storage to MinIO — uncomment the minio / createbuckets
    # services below and append the DOCY_S3_* entries to the environment
    # section above (see docs/docker-deployment.md).
    # DOCY_S3_ENDPOINT_URL must be reachable from browsers too (presigned
    # upload/download URLs are opened client-side): use the server's LAN
    # address or a domain, e.g. http://192.168.0.10:9000.
    #   DOCY_STORAGE_DRIVER: minio
    #   DOCY_S3_ENDPOINT_URL: http://<server-host>:9000
    #   DOCY_S3_ACCESS_KEY: minioadmin
    #   DOCY_S3_SECRET_KEY: minioadmin
    #   DOCY_S3_BUCKET: docy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/common/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---- Optional: switch storage to MinIO (see docs/docker-deployment.md) ----
  # Uncomment this block AND the createbuckets service, and set the DOCY_S3_*
  # environment variables on the docy service above.
  # Silo = community-maintained MinIO fork (official MinIO images no longer
  # allow anonymous pulls, and the Bitnami legacy build lacks bucket CORS).
  # minio:
  #   image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
  #   # Silo runs as root by default and supports bucket CORS on single drive.
  #   command: silo server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"          # S3 API — browsers upload to presigned URLs here
  #     - "9001:9001"          # web console
  #   volumes:
  #     - minio-data:/data
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   restart: unless-stopped

  # The app does not create buckets itself; this one-shot creates the `docy`
  # bucket and its CORS rules on first boot (idempotent, safe to re-run).
  # The bitnamilegacy mc is old: CORS must be set from an XML file,
  # `mc cors set ALIAS/BUCKET cors.xml` — verified working against Silo.
  # createbuckets:
  #   image: bitnamilegacy/minio-client:latest
  #   depends_on:
  #     - minio
  #   entrypoint: >
  #     /bin/sh -c '
  #     mc alias set myminio http://minio:9000 minioadmin minioadmin;
  #     until mc ls myminio >/dev/null 2>&1; do sleep 2; done;
  #     mc mb --ignore-existing myminio/docy;
  #     printf "%s" "<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>POST</AllowedMethod><AllowedMethod>DELETE</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>" > /tmp/cors.xml;
  #     mc cors set myminio/docy /tmp/cors.xml;
  #     '

volumes:
  docy-data:
  docy-config:
  # minio-data:

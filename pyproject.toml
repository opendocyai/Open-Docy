[project]
name = "open_docy"
version = "0.0.1"
description = "Open-source document automation and AI agent workflow server (FastAPI + Typer CLI)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
keywords = ["ai", "agent", "document-processing", "document-automation", "workflow", "fastapi"]
authors = [
    { name = "Docy" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/backend/docy"]
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]

# The built frontend (src/frontend/dist-web) is shipped inside the wheel so
# that installed users get the UI without Node. Build it first: `docy build-web`.
# The hook adds the include conditionally: a fresh checkout without dist-web
# must still build, otherwise `uv sync` would fail before the first build.
[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[project.scripts]
docy = "docy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
